openapi: 3.0.3
info:
  title: CRM المحترف API
  version: 0.2.0
  description: |
    APIs for stories UM-01, CM-05, IN-02, CP-03, UM-07.

    Conventions:
    - Paged lists return `hasNextPage` instead of a total count (the server fetches PageSize + 1 rows).
    - All dropdown lists come from a single endpoint: `GET /lookups`.
    - Everything except login and refresh requires a JWT bearer token.
    - Every request body AND every query-string set is bound to a schema named `*Request`.
      Query-string requests are sent flattened (`?PageNumber=1&PageSize=20&Name=ali`);
      arrays are sent as repeated keys (`?TagIds=1&TagIds=2`).
    - JSON request bodies and JSON responses use camelCase property names (e.g. `fullName`, `hasNextPage`); query-string parameters keep PascalCase (e.g. `PageNumber`, `RoleId`).
    - Calls that return no data answer `204 No Content` (no body).
    - Every error (400, 401, 403, 404, 423, 500) uses the single `ErrorDto` JSON: `{ "status": 400, "message": "..." }`.
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Lookups
  - name: Contacts
  - name: Campaigns
  - name: Questions
  - name: Users

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in (UM-01)
      description: Any failed login returns the same generic 401 message. A locked account returns 423.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "423":
          description: Account locked after repeated failed attempts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorDto" }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Exchange a refresh token for a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /lookups:
    get:
      tags: [Lookups]
      operationId: getLookups
      summary: All dropdown lists in one call
      description: |
        `Include` is optional. Without it every list is returned.
        Campaigns are intentionally not included (too many); use `GET /campaigns?Title=`.
      parameters:
        - name: request
          in: query
          required: false
          style: form
          explode: true
          schema: { $ref: "#/components/schemas/GetLookupsRequest" }
      responses:
        "200":
          description: Requested lists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LookupsDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /contacts:
    get:
      tags: [Contacts]
      operationId: getContacts
      summary: View and search contacts (CM-05)
      description: |
        A contact can be a student's guardian, so `StudentName` and `ContactName` are separate filters.
        `StudentName` returns the contacts that have a student with a matching name.
        `CampaignTitle` matches any of the contact's leads (partial match); the response shows the last campaign.
      parameters:
        - name: request
          in: query
          required: true
          style: form
          explode: true
          schema: { $ref: "#/components/schemas/GetContactsRequest" }
      responses:
        "200":
          description: A page of contacts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactsPageDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /campaigns:
    get:
      tags: [Campaigns]
      operationId: searchCampaigns
      summary: Search campaigns
      description: |
        Every filter is optional and filters are combined with AND.
        - `Title`: partial, case-insensitive match on the campaign title.
        - `Status`: campaign status id (from `GET /lookups`, list `CampaignStatuses`).
        - `TrackId`: track id (from `GET /lookups`, list `Tracks`).
        - `PlatformId`: campaigns that run on this platform (from `GET /lookups`, list `Platforms`).
      parameters:
        - name: request
          in: query
          required: true
          style: form
          explode: true
          schema: { $ref: "#/components/schemas/GetCampaignsRequest" }
      responses:
        "200":
          description: A page of campaigns
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignsPageDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /campaigns/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Campaigns]
      operationId: getCampaign
      summary: Get a campaign with its platforms and questions
      description: "`questions` are only the questions currently linked to the campaign. To see everything in the Google Sheet use `GET /campaigns/{id}/questions`."
      responses:
        "200":
          description: Campaign details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignDetailDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Campaigns]
      operationId: updateCampaign
      summary: Edit campaign data (CP-03)
      description: |
        `platformIds` replaces the campaign's platforms.
        `questionIds` replaces the campaign's questions: the questions in the array are kept, any question
        not in the array is unlinked from the campaign (this is how the user drops a question that came from the sheet).
        Omit `questionIds` to leave the campaign's questions unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCampaignRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /campaigns/{id}/questions:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Campaigns]
      operationId: getCampaignQuestions
      summary: Get the campaign's questions from its Google Sheet
      description: |
        Called when the user presses "Edit" on a campaign. The server reads the Google Sheet from the
        campaign's `url` and returns its questions. This call only reads: it creates and changes nothing.
        Questions are created in the DB at import time (`POST /campaigns/{id}/import`), so every returned question
        already has an `id`. A question that was imported but not configured yet has `type` null until the user
        sets it with `PUT /questions/{id}`.
        A question can be shared by several campaigns, so `isSelected` is relative to this campaign only: true when
        the question is linked to this campaign, false when it is not (even if another campaign uses it).
        The user picks the ones to keep and sends their ids in `questionIds` of `PUT /campaigns/{id}`.
        A sheet question that has no DB record yet (the import never ran) is not returned.
        Returns 400 if the campaign has no url or the sheet cannot be read.
      responses:
        "200":
          description: Questions found in the sheet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignQuestionsDto" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /campaigns/{id}/import:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [Campaigns]
      operationId: importCampaignData
      summary: Trigger a customer import on demand (IN-02)
      description: |
        Reads the Google Sheet from the campaign's `url`. Returns 400 if the campaign has no url.
        The import is also where questions are created: a sheet question that does not exist yet is created
        (unconfigured, `type` null). An existing question is reused, not duplicated, so one question can be shared
        by several campaigns.
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResultDto" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /questions/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [Questions]
      operationId: updateQuestion
      summary: Configure a question that came from the Google Sheet
      description: |
        Questions are created by the import from the Google Sheet (`POST /campaigns/{id}/import`).
        This call sets what the sheet cannot provide:
        the type, the DB field, and the answers linked to tags. See `UpdateQuestionRequest` for the rules of each type.
        A question can be shared by several campaigns, so the change applies to all of them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateQuestionRequest" }
            examples:
              field:
                summary: Type 1, linked to a DB field
                value:
                  question: What is the child's name?
                  type: 1
                  fieldId: 3
              boolean:
                summary: Type 2, yes/no linked to a tag
                value:
                  question: Do you have a laptop?
                  type: 2
                  answers:
                    - { tagId: 7, answer: "Yes" }
              choice:
                summary: Type 3, multiple choice
                value:
                  question: Which course are you interested in?
                  type: 3
                  answers:
                    - { tagId: 11, answer: Programming }
                    - { tagId: 12, answer: Design }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users:
    get:
      tags: [Users]
      operationId: getUsers
      summary: List and search users
      description: |
        Every filter is optional and filters are combined with AND. Without any filter all users are returned.
        - `Name`: partial, case-insensitive match on the full name (`fullName`).
        - `AccountName`: partial, case-insensitive match on the login name.
        - `Email`: partial, case-insensitive match on the email.
        - `IsActive`: `true` active users only, `false` disabled users only.
        - `RoleId`: users that have this role (from `GET /lookups`, list `Roles`).
        - `DepartmentId`: users that have a role in this department (from `GET /lookups`, list `Departments`).
      parameters:
        - name: request
          in: query
          required: true
          style: form
          explode: true
          schema: { $ref: "#/components/schemas/GetUsersRequest" }
      responses:
        "200":
          description: A page of users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsersPageDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Users]
      operationId: getUser
      summary: Get one user with department/role permissions
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetailDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Users]
      operationId: updateUser
      summary: Edit user data (UM-07)
      description: "`permissions` replaces the user's department/role pairs."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }

  responses:
    NoContent:
      description: Done, no body
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorDto" }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorDto" }
    Forbidden:
      description: The user's role does not allow this action
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorDto" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorDto" }

  schemas:
    # ---------- Errors ----------
    ErrorDto:
      type: object
      description: The single JSON shape returned for every error response.
      required: [status, message]
      properties:
        status: { type: integer, example: 400 }
        message: { type: string, example: Campaign has no url }

    # ---------- Common ----------
    TagItemDto:
      type: object
      required: [id, tag]
      properties:
        id: { type: integer }
        tag: { type: string }

    PermissionDto:
      type: object
      required: [id, departmentName, roleName]
      properties:
        id: { type: integer }
        departmentName: { type: string }
        roleName: { type: string }

    # ---------- Requests ----------
    PagedRequest:
      type: object
      required: [PageNumber]
      properties:
        PageNumber: { type: integer, minimum: 1, default: 1 }

    PermissionRequest:
      type: object
      required: [roleId, departmentId]
      properties:
        roleId: { type: integer }
        departmentId: { type: integer }

    LoginRequest:
      type: object
      required: [accountName, password]
      properties:
        accountName: { type: string }
        password: { type: string, format: password }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    GetLookupsRequest:
      type: object
      properties:
        Include:
          type: array
          description: Repeated key, e.g. `Include=Tracks&Include=Tags`. Omit to get every list.
          items:
            type: string
            enum:
              [
                Tracks,
                LeadStatuses,
                Tags,
                Platforms,
                Fields,
                CampaignStatuses,
                QuestionTypes,
                Departments,
                Roles,
              ]

    GetContactsRequest:
      allOf:
        - $ref: "#/components/schemas/PagedRequest"
        - type: object
          properties:
            CampaignTitle: { type: string }
            TrackId: { type: integer }
            LeadStatusId: { type: integer }
            TagIds:
              type: array
              description: Repeated key, e.g. `TagIds=1&TagIds=2`
              items: { type: integer }
            StudentName: { type: string }
            ContactName: { type: string }
            PhoneNumber: { type: string }

    GetCampaignsRequest:
      allOf:
        - $ref: "#/components/schemas/PagedRequest"
        - type: object
          properties:
            Title:
              type: string
              description: Partial, case-insensitive match on the campaign title.
            Status:
              type: integer
              description: Campaign status id (lookups `CampaignStatuses`).
            TrackId:
              type: integer
              description: Track id (lookups `Tracks`).
            PlatformId:
              type: integer
              description: Campaigns that run on this platform (lookups `Platforms`).

    GetUsersRequest:
      allOf:
        - $ref: "#/components/schemas/PagedRequest"
        - type: object
          properties:
            Name:
              type: string
              description: Partial, case-insensitive match on the full name.
            AccountName:
              type: string
              description: Partial, case-insensitive match on the login name.
            Email:
              type: string
              description: Partial, case-insensitive match on the email.
            IsActive:
              type: boolean
              description: true = active users only, false = disabled users only.
            RoleId:
              type: integer
              description: Users that have this role (lookups `Roles`).
            DepartmentId:
              type: integer
              description: Users that have a role in this department (lookups `Departments`).

    UpdateCampaignRequest:
      type: object
      required: [title, status, trackId]
      properties:
        title: { type: string }
        description: { type: string }
        status: { type: integer }
        trackId: { type: integer }
        url: { type: string }
        budget: { type: number, format: double }
        platformIds:
          type: array
          items: { type: integer }
        questionIds:
          type: array
          description: The questions to keep on the campaign (replaces the current list). Omit to leave unchanged.
          items: { type: integer }

    UpdateQuestionAnswerRequest:
      type: object
      required: [tagId, answer]
      properties:
        tagId: { type: integer }
        answer: { type: string }

    UpdateQuestionRequest:
      type: object
      required: [question, type]
      description: |
        Validation by type:
        - type 1: `fieldId` required, `answers` must be empty.
        - type 2: `fieldId` null, `answers` has exactly one item.
        - type 3: `fieldId` null, `answers` has two or more items.
      properties:
        question: { type: string }
        type: { $ref: "#/components/schemas/QuestionType" }
        fieldId: { type: integer, nullable: true }
        answers:
          type: array
          items: { $ref: "#/components/schemas/UpdateQuestionAnswerRequest" }

    UpdateUserRequest:
      type: object
      required: [accountName, fullName, email]
      properties:
        accountName: { type: string }
        fullName: { type: string }
        email: { type: string, format: email }
        isActive: { type: boolean }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/PermissionRequest" }

    # ---------- Responses ----------
    LoginDto:
      type: object
      required: [token, refreshToken, userId]
      properties:
        token: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: Token lifetime in seconds }
        userId: { type: integer }
        fullName: { type: string }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/PermissionDto" }

    TokenDto:
      type: object
      required: [token, refreshToken]
      properties:
        token: { type: string }
        refreshToken: { type: string }

    TrackDto:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    CampaignStatuseDto:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    QuestionTypeDto:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    FieldDto:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    PlatformDto:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    DepartmentDto:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    RoleDto:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    LeadStatuseDto:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    LookupsDto:
      type: object
      description: Only the lists requested through `Include` are present.
      properties:
        tracks:
          type: array
          items: { $ref: "#/components/schemas/TrackDto" }
        leadStatuses:
          type: array
          items: { $ref: "#/components/schemas/LeadStatuseDto" }
        tags:
          type: array
          items: { $ref: "#/components/schemas/TagItemDto" }
        platforms:
          type: array
          items: { $ref: "#/components/schemas/PlatformDto" }
        fields:
          type: array
          items: { $ref: "#/components/schemas/FieldDto" }
        questionTypes:
          type: array
          description: "Expected values: 1 = Field, 2 = Boolean, 3 = Choice"
          items: { $ref: "#/components/schemas/QuestionTypeDto" }
        campaignStatuses:
          type: array
          items: { $ref: "#/components/schemas/CampaignStatuseDto" }
        departments:
          type: array
          items: { $ref: "#/components/schemas/DepartmentDto" }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleDto" }

    StudentDto:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    ContactItemDto:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        students:
          type: array
          items: { $ref: "#/components/schemas/StudentDto" }

    PageDto:
      type: object
      required: [pageNumber, hasNextPage]
      properties:
        pageNumber: { type: integer }
        hasNextPage: { type: boolean }

    ContactsPageDto:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ContactItemDto" }
        page: { $ref: "#/components/schemas/PageDto" }

    CampaignListItemDto:
      type: object
      required: [id, title]
      properties:
        id: { type: integer }
        title: { type: string }
        status: { type: integer }
        trackId: { type: integer }

    CampaignsPageDto:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CampaignListItemDto" }
        page: { $ref: "#/components/schemas/PageDto" }

    CampaignDetailDto:
      type: object
      required: [id, title]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        status: { type: integer }
        trackId: { type: integer }
        url:
          {
            type: string,
            description: Google Sheet link used by the import and by the questions endpoint,
          }
        budget: { type: number, format: double }
        platforms:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer }
              name: { type: string }
        questions:
          type: array
          items: { $ref: "#/components/schemas/QuestionDto" }

    QuestionType:
      type: integer
      enum: [1, 2, 3]
      description: |
        1 = Field: the client's free-text answer is stored in a DB field (e.g. Student.Name).
        2 = Boolean: yes/no. A "yes" answer is linked to a tag and creates the link between the student/contact and that tag.
        3 = Choice: several answers, each linked to a tag. The client's chosen answer attaches its tag.

    QuestionAnswerDto:
      type: object
      required: [tagId, answer]
      properties:
        tagId: { type: integer }
        answer: { type: string }

    QuestionDto:
      type: object
      required: [id, question]
      properties:
        id: { type: integer }
        question: { type: string }
        type:
          allOf:
            - $ref: "#/components/schemas/QuestionType"
          nullable: true
          description: null until the question is configured with `PUT /questions/{id}`.
        fieldId: { type: integer, nullable: true }
        answers:
          type: array
          items: { $ref: "#/components/schemas/QuestionAnswerDto" }

    CampaignQuestionItemDto:
      allOf:
        - $ref: "#/components/schemas/QuestionDto"
        - type: object
          required: [isSelected]
          properties:
            isSelected:
              type: boolean
              description: Whether the question is linked to this campaign (a question can be linked to several campaigns).

    CampaignQuestionsDto:
      type: object
      required: [campaignId, questions]
      properties:
        campaignId: { type: integer }
        questions:
          type: array
          items: { $ref: "#/components/schemas/CampaignQuestionItemDto" }

    ImportResultDto:
      type: object
      required: [importedCount, skippedCount]
      description: Row-level problems are listed in `errors`; a failed import as a whole returns an ErrorDto.
      properties:
        importedCount: { type: integer }
        skippedCount: { type: integer }
        errors:
          type: array
          items:
            type: object
            properties:
              row: { type: integer }
              message: { type: string }

    UserListItemDto:
      type: object
      required: [id, accountName]
      properties:
        id: { type: integer }
        accountName: { type: string }
        fullName: { type: string }
        email: { type: string, format: email }
        isActive: { type: boolean }

    UsersPageDto:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UserListItemDto" }
        page: { $ref: "#/components/schemas/PageDto" }

    UserDetailDto:
      allOf:
        - $ref: "#/components/schemas/UserListItemDto"
        - type: object
          properties:
            permissions:
              type: array
              items: { $ref: "#/components/schemas/PermissionDto" }
